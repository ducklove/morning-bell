name: Polymarket Morning Briefing

# The daily 08:07 KST run now happens on the home server via a systemd user
# timer (see systemd/polymarket-briefing.timer), which also auto-deploys on
# push. This workflow is kept for manual/on-demand runs only — a `schedule`
# trigger here would send duplicate notifications alongside the server.
on:
  workflow_dispatch:

concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POLYMARKET_BRIEFING_STATE_DIR: ${{ runner.temp }}/morning-bell-state
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run briefing
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cp config.example.yaml config.yaml
          polymarket-briefing run --config config.yaml --ai-summary

      - name: Save manual-run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-briefing-state
          path: ${{ runner.temp }}/morning-bell-state/*.sqlite
          retention-days: 7
          if-no-files-found: ignore
