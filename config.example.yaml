timezone: Asia/Seoul

polymarket:
  gamma_base_url: "https://gamma-api.polymarket.com"
  clob_base_url: "https://clob.polymarket.com"
  request_timeout_seconds: 20
  max_retries: 3
  backoff_seconds: 1.5
  # Gamma API는 /events 한 번에 최대 100개까지만 돌려줍니다.
  # discovery.max_events에 도달할 때까지 이 크기로 페이지를 넘겨가며 수집합니다.
  page_size: 100

# Prediction markets resolve and disappear, so these need periodic review.
# A slug whose markets have all closed is reported in the briefing as
# "[점검] 워치리스트 N개가 종료됨" rather than failing silently.
# Verified live 2026-07-28.
watchlist_slugs:
  - largest-company-end-of-december-2026
  - strait-of-hormuz-traffic-returns-to-normal-by-august-31-20260702154212320
  - next-claude-opus-text-arena-debut-20260714204425670
  - us-announces-halt-in-iran-offensive-operations-byptptpt-20260718015003096

discovery:
  enabled: true
  max_events: 300
  include_active_only: true
  include_closed: false
  min_volume_24h: 1000
  exclude_terms:
    - what will trump say
    - will trump say
    - say during
  keywords:
    ai_frontier:
      weight: 1.0
      terms: [OpenAI, Anthropic, Google, Gemini, Claude, xAI, Grok, GPT, GPT-5, GPT-5.6, Chatbot Arena, AI model, LLM, AGI]
    korea_politics:
      weight: 1.0
      terms: [Seoul, Korea, Korean, Seoul mayor, mayoral election, Korean presidential election, Democratic Party, People Power Party]
    us_politics:
      weight: 1.0
      terms: [Senate, House, Congress, midterms, balance of power, Democrat, Republican, governor, election]
    frontier_tech_markets:
      weight: 0.95
      terms: [SpaceX, xAI, Tesla, IPO, valuation, closing market cap, IPO day, Starlink, Neuralink, private company]
    geopolitics_logistics:
      weight: 0.9
      terms: [Hormuz, Iran, Israel, shipping, oil tanker, blockade, ceasefire]
    bigtech_marketcap:
      weight: 0.9
      terms: [NVIDIA, Apple, Microsoft, Alphabet, Meta, Amazon, Tesla, SpaceX, largest company, GPU]

scoring:
  min_score_to_notify: 35
  max_items: 7
  probability_change_alert_pp: 3.0
  sent_penalty_days: 7
  sent_penalty_factor: 0.25
  sent_event_penalty_factor: 0.60
  # 이 확률 미만인 결과(예: 0.1% 후보)는 가망이 없으므로 브리핑 본문에서 숨깁니다.
  min_probability_to_show: 0.03
  # 같은 주제의 중복 이벤트(예: "Largest Company end of July" vs "... end of August")를
  # 주제당 이 개수까지만 남기고 접습니다.
  max_events_per_topic: 1
  score_weights:
    change_signal: 0.40
    relevance_signal: 0.25
    volume_signal: 0.15
    probability_signal: 0.10
    deadline_signal: 0.07
    liquidity_signal: 0.03

ai_summary:
  # 규칙 기반 번역은 사전에 없는 표현을 영어로 남겨 "NVIDIA가 the 세계 최대 기업"
  # 같은 혼합 문장을 만듭니다. LLM 경로를 기본으로 두고, 키가 없거나 호출이
  # 실패하면 규칙 기반 요약으로 자동 폴백합니다(발송 자체는 절대 막지 않음).
  enabled: true
  model: "qwen/qwen3.6-flash"
  max_retries: 3
  timeout_seconds: 45
  backoff_seconds: 1.5

notification:
  provider: ntfy
  dry_run_default: false
  ntfy:
    topic_env: NTFY_TOPIC
    title: "Polymarket 아침 브리핑"
    priority: 3
  telegram:
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID

storage:
  path: "state/briefing_state.sqlite"
